<!doctype html>
<html lang="zh-CN">
  <body style="font-family: sans-serif; line-height: 1.6; color: #1f2937">
    <h1>验证你的 Fandom Harbor 邮箱</h1>
    <p>你的 6 位验证码是：</p>
    <p style="font-size: 28px; font-weight: 700; letter-spacing: 0.3em">
      {{ .Token }}
    </p>
    <p>验证码 15 分钟内有效。邀请码预留期限不会因重发邮件而延长。</p>
    <p>如果你没有发起注册，请忽略这封邮件，不要向任何人提供验证码。</p>
  </body>
</html>
